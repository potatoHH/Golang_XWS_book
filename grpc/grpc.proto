syntax= "proto3";
option go_package = "Book_Exp/grpc";

message User{
  int64 id =1;
  string name =2;
}
service UserService{
  rpc GetById(GetByIdRequest) returns (GetByIdResponse);
  rpc UpdateById(UpdateRequest)returns(UpdateByIdResponse);

}
message GetByIdRequest{
  int64 id =1;
}
message UpdateRequest{
  int64 id =2;
}
message UpdateByIdResponse{
  User user =2;

}
message GetByIdResponse{
  User user =1;
}


